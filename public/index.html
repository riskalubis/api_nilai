</div>

<script>

/* =========================
   URL API
========================= */

const API = "/api/nilai";


/* =========================
   PESAN
========================= */

function showMessage(message, success = true) {

    const element = document.getElementById("message");

    element.textContent = message;

    element.style.display = "block";

    if (success) {
        element.style.background = "#d4edda";
        element.style.color = "#155724";
    } else {
        element.style.background = "#f8d7da";
        element.style.color = "#721c24";
    }

    setTimeout(() => {
        element.style.display = "none";
    }, 3000);
}


/* =========================
   LOAD DATA
========================= */

async function loadData() {

    const tbody = document.getElementById("dataNilai");

    try {

        const filter =
            document.getElementById("filter").value;

        let url = API;

        if (filter !== "") {
            url += "?keterangan=" +
                encodeURIComponent(filter);
        }

        const response = await fetch(url);

        if (!response.ok) {
            throw new Error("API Error");
        }

        const result = await response.json();

        tbody.innerHTML = "";

        if (
            !result.data ||
            result.data.length === 0
        ) {

            tbody.innerHTML = `
                <tr>
                    <td colspan="7">
                        Belum ada data
                    </td>
                </tr>
            `;

            return;
        }


        result.data.forEach(item => {

            tbody.innerHTML += `
                <tr>
                    <td>${item.id}</td>
                    <td>${item.nim}</td>
                    <td>${item.nama}</td>
                    <td>${item.mata_kuliah}</td>
                    <td>${item.nilai}</td>
                    <td>${item.keterangan}</td>
                    <td>${item.grade}</td>
                </tr>
            `;

        });

    } catch (error) {

        console.error(error);

        tbody.innerHTML = `
            <tr>
                <td colspan="7">
                    Gagal mengambil data dari API
                </td>
            </tr>
        `;

    }
}


/* =========================
   POST DATA
========================= */

document
    .getElementById("nilaiForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();


        const nim =
            document.getElementById("nim")
                .value
                .trim();

        const nama =
            document.getElementById("nama")
                .value
                .trim();

        const mataKuliah =
            document.getElementById("mata_kuliah")
                .value
                .trim();

        const nilai =
            Number(
                document.getElementById("nilai").value
            );


        /* Validasi NIM 10 digit */

        if (!/^[0-9]{10}$/.test(nim)) {

            showMessage(
                "NIM harus tepat 10 digit angka",
                false
            );

            return;
        }


        /* Validasi nilai */

        if (nilai < 0 || nilai > 100) {

            showMessage(
                "Nilai harus antara 0 sampai 100",
                false
            );

            return;
        }


        const data = {

            nim: nim,

            nama: nama,

            mata_kuliah: mataKuliah,

            nilai: nilai

        };


        try {

            const response =
                await fetch(API, {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(data)

                });


            const result =
                await response.json();


            if (
                response.ok &&
                result.status === "success"
            ) {

                showMessage(
                    "Data berhasil ditambahkan"
                );

                document
                    .getElementById("nilaiForm")
                    .reset();

                loadData();

            } else {

                showMessage(
                    result.message ||
                    "Gagal menambahkan data",
                    false
                );

            }

        } catch (error) {

            console.error(error);

            showMessage(
                "Tidak dapat terhubung ke API",
                false
            );

        }

    });


/* =========================
   FILTER
========================= */

document
    .getElementById("filter")
    .addEventListener(
        "change",
        loadData
    );


/* =========================
   LOAD PERTAMA
========================= */

loadData();

</script>
